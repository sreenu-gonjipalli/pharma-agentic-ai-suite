# OpenRouter model routing (CLAUDE.md Section 5).
# Rule 5: pin exact IDs here, never a ":free" suffix on the demo path, prompt logging disabled.
provider: openrouter
base_url: https://openrouter.ai/api/v1

routes:
  triage_guardrail:
    model: openai/gpt-5.6-luna
    price_per_1m_in: 0.20
    price_per_1m_out: 1.20
    note: "Triage, guardrail check"

  supervisor_planning:
    model: anthropic/claude-opus-5
    price_per_1m_in: 5
    price_per_1m_out: 25
    note: "Supervisor planning -- spend on the plan"

  retrieval:
    model: z-ai/glm-5.3-flash
    price_per_1m_in: 0.15
    price_per_1m_out: 0.50
    note: "Retrieval (long context)"

  extraction:
    model: deepseek/deepseek-v4.1-flash
    price_per_1m_in: 0.10
    price_per_1m_out: 0.50
    note: "Extraction, tool exec"

  analysis_drafting:
    model: anthropic/claude-sonnet-5
    price_per_1m_in: 2
    price_per_1m_out: 10
    note: "Analysis, drafting -- CAPADrafter"

  eval_judge:
    model: openai/gpt-6-astra
    price_per_1m_in: 10
    price_per_1m_out: 50
    note: "Eval judge, cross-family from the routes above"

# Rule 5: prompt logging disabled -- src/llm.py must never log message content, only
# route name, model, token counts, latency, and cost.
prompt_logging: false
